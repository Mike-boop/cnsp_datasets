[tool.poetry]
name = "cnsp_datasets"
version = "0.1.0"
description = "tool for obtaining and standardising continuous-event neural data"
authors = ["Mike Thornton <mike.d.thornton@fau.de>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "cnsp_datasets" }]
include = ["cnsp_datasets/datasets/*/dataset.json", "cnsp_datasets/datasets/*/*.csv"]

[tool.poetry.dependencies]
python = ">=3.10.12"  # tarfile filter="data"
numpy = "2.2.5"
requests = "^2.32"
httpx = ">=0.27"
tqdm = "4.67.1"
mne = "1.9.0"  # pinned: li2025 and libribrain100 use raw._raw_extras (tests/test_mne_private_api.py)
pandas = "2.2.3"
scikit-learn = "1.6.1"
scipy = "1.15.2"
h5py = "3.13.0"
pymatreader = "1.1.0"
nibabel = "5.3.2"
openpyxl = "3.1.5"
pyarrow = "25.0.1"
soundfile = "0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
ruff = ">=0.6"
ipykernel = "^6.30.1"
spyeeg = "0.2.2"
reservoirpy = "0.3.14"
tpcp = "2.1.0"

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"